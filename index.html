<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Character Generator</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #141e30, #243b55);
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        text-align: center;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 20px;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 320px;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    img {
        width: 100%;
        border-radius: 15px;
        margin-top: 15px;
        display: none;
        animation: zoomIn 0.5s ease;
    }

    @keyframes zoomIn {
        from {transform: scale(0.8); opacity: 0;}
        to {transform: scale(1); opacity: 1;}
    }

    h2 {
        margin-top: 10px;
        min-height: 40px;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
    }

    .start {
        background: #00c6ff;
        color: white;
    }

    .reload {
        background: #ff7a18;
        color: white;
    }

    button:hover {
        transform: scale(1.1);
    }

    button:active {
        transform: scale(0.95);
    }
</style>
</head>

<body>

<div class="container">
    <h1>Anime Generator 🎌</h1>
    <h2 id="name">Click Start</h2>
    <img id="image" src="" alt="Anime Character">

    <div>
        <button class="start" onclick="getCharacter()">Start</button>
        <button class="reload" onclick="getCharacter()">Reload</button>
    </div>
</div>

<script>
async function getCharacter() {
    const name = document.getElementById("name");
    const image = document.getElementById("image");

    name.innerText = "Loading...";
    image.style.display = "none";

    try {
        const response = await fetch("https://api.jikan.moe/v4/characters?page=" + Math.floor(Math.random() * 100));
        const data = await response.json();

        const randomChar = data.data[Math.floor(Math.random() * data.data.length)];

        name.innerText = randomChar.name;
        image.src = randomChar.images.jpg.image_url;
        image.style.display = "block";

    } catch (error) {
        name.innerText = "Failed to load 😢";
    }
}
</script>

</body>
</html>
